name: SkipList CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache GoogleTest
        uses: actions/cache@v3
        id: gtest-cache
        with:
          path: /usr/local/lib/libgtest.a
          key: ${{ runner.os }}-gtest

      - name: Install dependencies
        if: steps.gtest-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtest-dev cmake
          cd /usr/src/gtest
          sudo cmake CMakeLists.txt
          sudo make
          sudo cp lib/*.a /usr/local/lib

      - name: Build project
        run: make

      - name: Run tests
        env:
          CI: true  # Set CI environment variable
        run: |
          # Add timeout to prevent hanging
          timeout 120s ./skip_list_test || echo "Tests timed out"

      - name: Clean build artifacts
        run: |
          make clean
          if [ -f skip_list_test ] || [ -d build ]; then
            echo "Clean failed! Artifacts still present"
            exit 1
          fi